server {
    listen 8080;
    server_name _;

    # Behind Cloud Run, nginx only sees plain HTTP on :8080. Without this, a
    # request to a directory without a trailing slash (e.g. /coffee) gets a 301
    # to an ABSOLUTE url built from :8080 (http://host:8080/coffee/), which the
    # browser cannot reach, so the page hangs. Relative redirects resolve
    # against the real https address instead.
    absolute_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}